# PoC of the file server + archive design.
#   Local fake S3:  docker compose --env-file env.local --profile local up --build
#   Real AWS S3:    docker compose --env-file env.aws up --build
services:
  server:
    build: .
    env_file: ${ENV_FILE:-env.local}
    cap_add: [SYS_ADMIN]          # needed for the FUSE mount of the bucket
    devices: ["/dev/fuse"]
    security_opt: ["apparmor:unconfined"]
    ports: ["${SMB_PORT:-1445}:445"]
    volumes:
      - projects:/srv/projects
      - uploads:/srv/uploads

  # Stand-in for S3 when testing offline. Not used with real AWS.
  s3:
    profiles: [local]
    image: rclone/rclone:latest
    command: serve s3 /data --addr :9000 --auth-key poc-key,poc-secret-123
    volumes:
      - ./fake-s3:/data

volumes:
  projects:
  uploads:
