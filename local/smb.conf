[global]
   server role = standalone server
   workgroup = WORKGROUP
   map to guest = never
   server min protocol = SMB3
   smb encrypt = required
   disable netbios = yes
   smb ports = 445
   load printers = no
   printing = bsd
   log file = /dev/stdout
   log level = 1
   # users only see shares and folders they are allowed to open
   access based share enum = yes
   hide unreadable = yes

# Active projects: read-write, one group per project folder
[Projects]
   path = /srv/projects
   valid users = @staff
   read only = no
   inherit permissions = yes
   force create mode = 0660
   force directory mode = 2770

# Uploads: write-once drop folders. Upload allowed, changing or deleting afterwards is not.
# Uploaded files become owned by the folder owner and read-only.
[Uploads]
   path = /srv/uploads
   valid users = @staff
   read only = no
   inherit owner = yes
   create mask = 0440
   force create mode = 0440
   directory mask = 0000
   force directory mode = 3770

# Archive: the S3 bucket, read-only, one mount per access zone
[Archive]
   path = /srv/archive
   valid users = @staff
   read only = yes
