name: ci

on:
  push:
  pull_request:

jobs:
  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [terraform/bootstrap, terraform/poc]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --severity=warning $(git ls-files '*.sh')

  user-data-tests:
    # Boots the real user-data scripts in systemd containers (fake S3,
    # loop device for EBS, Docker-in-Docker for wg-easy).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo modprobe fuse loop || true
      # Ubuntu 24.04+ hosts ship an AppArmor profile for /usr/bin/fusermount3.
      # Profiles attach by path, so it also confines fusermount3 inside the
      # test container and refuses the archive mounts. CI runner only.
      - run: |
          if [ -e /etc/apparmor.d/fusermount3 ]; then
            sudo apparmor_parser -R /etc/apparmor.d/fusermount3
          fi
      - run: ./terraform/poc/test/run-fileserver-test.sh
      - run: ./terraform/poc/test/run-vpn-test.sh
